# Settings for the mod. RecompModTool reads this to make the .nrm file.

[manifest]

id = "btga_gunbuddy_mod"

version = "0.2.0"

# Shown in the Mods menu.
display_name = "Gun Buddy Select"
description = """
Pick which gun buddy you put down. \
The game has more gun buddies than the small double cannon a normal deploy gives you: \
A+B puts down a random mix that also has a pop-up gun, a floating cannon and a big quad cannon. \
This mod lets a normal deploy put down any of those, and can make A+B put down your pick too. \
Pick a cycle button to switch between them in game.

https://github.com/wootbeer/btga-gunbuddy-mod"""
short_description = "Pick which gun buddy you put down."

authors = [ "wootbeer" ]

game_id = "btga"

minimum_recomp_version = "0.1.8"

dependencies = []
optional_dependencies = []

native_libraries = []

[inputs]

elf_path = "build/mod.elf"

mod_filename = "btga_gunbuddy_mod"

func_reference_syms_file = "syms/battletanxga.us.rev0.syms.toml"
data_reference_syms_files = []

additional_files = [ "thumb.png" ]

# Options shown in the Mods menu. Read them with recomp_get_config_u32.
# The order of each Enum's options matters: src/main.c reads the option's
# index.

[[manifest.config_options]]
id = "deploy_type"
name = "Gun Buddy"
description = "Which gun buddy you put down. Normal: the small double cannon a deploy gives you. Pop-Up Gun: comes up out of the ground. Floating Cannon: a single cannon. Quad Cannon: the big four-barrel one; it needs more room, so it can land further from your tank. Random: one of A+B's mix each time."
type = "Enum"
options = [ "Normal", "Pop-Up Gun", "Floating Cannon", "Quad Cannon", "Random" ]
default = "Normal"

[[manifest.config_options]]
id = "cycle_button"
name = "Cycle Button"
description = "A button that steps you through the gun buddies in game (Normal, Pop-Up Gun, Floating Cannon, Quad Cannon, Random), each player on their own, starting from the Gun Buddy option. A message says which one you're on. Pick a button your controls don't use: this game treats the D-pad and the C buttons as the same buttons, so a D-pad button also does what its C button does. In the recomp's controls you can put the N64 button on any spare button or key."
type = "Enum"
options = [ "Off", "L", "R", "Z", "D-Pad Up", "D-Pad Down", "D-Pad Left", "D-Pad Right", "C-Up", "C-Down", "C-Left", "C-Right" ]
default = "L"

[[manifest.config_options]]
id = "ab_deploy"
name = "A+B Deploy"
description = "What A+B puts down. Mixed: the game's random mix. Same as Gun Buddy: every one is the gun buddy picked above."
type = "Enum"
options = [ "Mixed", "Same as Gun Buddy" ]
default = "Mixed"

[[manifest.config_options]]
id = "applies_to"
name = "Applies To"
description = "Whose gun buddies change. Players: gangs with a human player in them (AI tanks in your gang too). Everyone: AI gangs as well."
type = "Enum"
options = [ "Players", "Everyone" ]
default = "Players"
